name: Verify Docker image

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, fileinfo, gd, zip
      - name: Install and audit PHP dependencies
        run: |
          composer install --no-interaction --prefer-dist
          composer validate --strict
          composer audit --locked
      - name: Run isolated application tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing it
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: revista-atacama:ci
      - name: Verify runtime
        run: |
          docker run --rm --entrypoint php revista-atacama:ci -v
          docker run --rm --entrypoint php revista-atacama:ci -r 'exit(ini_get("session.upload_progress.enabled") === "0" ? 0 : 1);'
          docker run --rm --entrypoint php revista-atacama:ci artisan route:list
