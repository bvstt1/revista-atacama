name: Verify Docker image

on:
  push:
    branches: [ master, security/october-2026 ]
  pull_request:
    branches: [ master ]

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - name: Match npm in the pinned Node build image
        run: npm install --global npm@11.19.1
      - name: Install from lockfile and build on Linux
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund
          npm run build
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, fileinfo, gd, zip
      - name: Install and audit PHP dependencies
        run: |
          composer install --no-interaction --prefer-dist
          composer validate --strict
          composer audit --locked
      - name: Run isolated application tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact
  build:
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing it
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: revista-atacama:ci
      - name: Verify runtime
        run: |
          docker run --rm --entrypoint php revista-atacama:ci -v
          docker run --rm --entrypoint php revista-atacama:ci -r 'exit(ini_get("session.upload_progress.enabled") === "0" ? 0 : 1);'
          docker run --rm --entrypoint php revista-atacama:ci artisan route:list
